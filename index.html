<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-siteapp" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-touch-fullscreen" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="full-screen" content="yes" />
  <!-- UC 强制全屏 / 应用模式 -->
  <meta name="browsermode" content="application" />
  <meta name="x5-fullscreen" content="true" />
  <!-- QQ 强制全屏 / 应用模式 -->
  <meta name="x5-page-mode" content="app" />

  <title>简单搜索 · Simple Search</title>
  <meta name="keywords" content="简单搜索,搜索导航,聚合搜索" />
  <meta name="description" content="简约舒爽的搜索体验：一个轻量、可自定义的聚合搜索导航页。" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#16181d" />

  <!-- 站点图标：优先使用体积小的 SVG，旧浏览器回退到 ico -->
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="alternate icon" href="favicon.ico" sizes="32x32 48x48" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://www.dmoe.cc" crossorigin />
  <link rel="preload" href="ziti/font.woff2" as="font" type="font/woff2" crossorigin />

  <link href="css/bizhi.css" rel="stylesheet" />
  <link href="css/sousuo.css" rel="stylesheet" />
  <link href="css/anim.css" rel="stylesheet" />
  <link href="css/ipinfo.css" rel="stylesheet" />
  <link href="css/weather.css" rel="stylesheet" />
  <link href="source/css/custom.css" rel="stylesheet" />
  <link href="css/responsive.css" rel="stylesheet" />
</head>
<body>
  <!-- 随机背景层（CSS 里带渐变兜底） -->
  <div class="bgo" aria-hidden="true"></div>

  <!-- 左上角天气（坐标来自 js/ipinfo.js 的 IP 归属地，渲染见 js/weather.js） -->
  <div class="weather-pill" id="weather" role="status" hidden>
    <span class="wx-icon" id="wx-icon" aria-hidden="true">⛅</span>
    <span class="wx-temp" id="wx-temp">--°</span>
    <span class="wx-desc" id="wx-desc"></span>
    <span class="wx-city" id="wx-city"></span>
  </div>

  <div id="menu" role="button" tabindex="0" aria-label="打开站点导航" aria-expanded="false">
   <i></i>
  </div>

  <!-- 点击遮罩关闭面板 -->
  <div class="panel-mask" id="panel-mask"></div>

  <div class="list closed">
  <!-- 过滤栏 -->
  <div class="panel-tools">
    <input type="search" id="panel-filter" class="panel-filter" placeholder="搜索站点…"
           aria-label="搜索站点" autocomplete="off" spellcheck="false" />
    <button type="button" id="panel-edit" class="panel-edit-btn" aria-label="编辑站点">编辑</button>
  </div>

  <!-- 编辑态工具（站点数据见 js/sites.js） -->
  <div class="panel-editor" id="panel-editor" hidden>
    <form class="site-add" id="site-add">
      <select id="site-cat" aria-label="选择分类"></select>
      <input type="text" id="site-name" placeholder="名称" aria-label="站点名称" autocomplete="off" />
      <input type="text" id="site-url" placeholder="https://链接" aria-label="站点链接" autocomplete="off" />
      <button type="submit">添加</button>
    </form>
    <div class="panel-editor-actions">
      <button type="button" id="site-reset">放弃本地修改</button>
    </div>
    <p class="panel-editor-tip" id="site-dirty-tip" hidden>⚠ 本地修改（仅保存在这台设备）</p>
  </div>

  <!-- 最近访问（JS 渲染，无记录时隐藏） -->
  <section class="panel-sec" id="panel-recent-sec" hidden>
    <h3 class="title" data-key="最近访问"><i class="iconfont icon-recent"></i>最近访问<span class="sec-caret" aria-hidden="true">▾</span></h3>
    <ul class="panel-links" id="panel-recent-links"></ul>
  </section>

  <p class="panel-empty" id="panel-empty" hidden>没有匹配的站点</p>

  <!-- 站点分类由 js/sites.js 数据渲染（见 js/panel.js） -->
  <div id="panel-body"></div>

  <!-- 站点状态入口（放在面板里，不受页脚 pointer-events 影响） -->
  <a class="panel-status" href="status.html">站点状态 · 死链报告</a>

</div>

<div id="search" class="s-search">
    <!-- 时间 / 日期 / 问候 -->
    <div class="hero-greet">
        <p class="greet-text" id="greet-text">你好</p>
        <p class="greet-time" id="greet-clock">--:--</p>
        <p class="greet-date" id="greet-date"></p>
    </div>

    <div id="search-list" class="hide-type-list">
        <div class="s-type" tabindex="0" aria-label="切换搜索类型分组">
            <span></span>
            <div class="s-type-list animated fadeInUp">
                <label for="type-Bing">常用</label>
                <label for="type-Google">搜索</label>  
            </div>
        </div>

        <!-- 常用搜索组 -->
        <div class="search-group group-a">
            <span class="type-text">常用</span>
            <ul class="search-type">
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-Bing" value="https://bing.com/search?q=" data-placeholder="Bing搜索" />
                    <label for="type-Bing">Bing</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-bilibili" value="https://search.bilibili.com/all?keyword=" data-placeholder="b站搜索" />
                    <label for="type-bilibili">哔哩哔哩搜索</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-GitHub" value="https://github.com/search?q=" data-placeholder="GitHub项目搜索" />
                    <label for="type-GitHub">GitHub</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-Steam" value="https://store.steampowered.com/account/registerkey?key=" data-placeholder="输入CDK码回车激活" />
                    <label for="type-Steam">Steam CDK激活</label>
                </li>
            </ul>
        </div>

        <!-- 搜索组 -->
        <div class="search-group group-b">
            <span class="type-text">搜索</span>
            <ul class="search-type">
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-Google" value="https://google.com/search?q=" data-placeholder="Google搜索" />
                    <label for="type-Google">Google</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-Bing2" value="https://bing.com/search?q=" data-placeholder="Bing搜索" />
                    <label for="type-Bing2">Bing</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-DuckDuckGo" value="https://duckduckgo.com/?q=" data-placeholder="DuckDuckGo搜索" />
                    <label for="type-DuckDuckGo">DuckDuckGo</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-Yandex" value="https://yandex.com/search/?text=" data-placeholder="Yandex搜索" />
                    <label for="type-Yandex">Yandex</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-Yahoo" value="https://search.yahoo.com/search?p=" data-placeholder="Yahoo搜索" />
                    <label for="type-Yahoo">Yahoo</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-WebCrawler" value="https://webcrawler.com/serp?q=" data-placeholder="WebCrawler搜索" />
                    <label for="type-WebCrawler">WebCrawler</label>
                </li>
                <li>
                    <input onclick="bw()" hidden type="radio" name="type" id="type-You" value="https://you.com/search?q=" data-placeholder="You搜索" />
                    <label for="type-You">You</label>
                </li>
            </ul>
        </div>
    </div>

    <!-- 搜索表单 -->
    <form action="https://www.google.com/search?q=" method="get" target="_blank" id="super-search-fm">
        <input type="text" id="search-text" name="q" placeholder="输入关键字搜索" aria-label="搜索关键词"
               role="searchbox" autocomplete="off" autocorrect="off" autocapitalize="off"
               aria-autocomplete="none" spellcheck="false" enterkeyhint="search" />
        <button type="submit" aria-label="搜索"><i class="iconfont icon-search"></i></button>
        <button type="button" id="random-site" class="search-random" aria-label="随机打开一个站点" title="随便逛逛">🎲</button>
        <ul id="ul" class="ko"></ul>
    </form>

    <!-- 隐藏高级搜索 -->
    <div id="yy" style="display:none;">
        <input type="text" id="kos" placeholder="输入关键字" autocomplete="off" autocorrect="off" autocapitalize="off" aria-autocomplete="none" spellcheck="false" />
        <button type="submit" id="kob"><i class="iconfont icon-xdss"></i></button>
        <ul id="kol" class="ko"></ul>
    </div>

    <div class="set-check hidden-xs">
        <input type="checkbox" id="set-search-blank" class="bubble-3" autocomplete="off" />
    </div>

</div>

<!-- 站点脚本（原生 JS，无第三方依赖） -->
<!-- defer：等 DOM 解析完再执行，避免脚本取不到页脚等靠后的节点 -->
<script defer src="js/xd.js"></script>
<script defer src="js/sites.js"></script>
<script defer src="js/panel.js"></script>
<script defer src="js/recent.js"></script>
<script defer src="js/clock.js"></script>
<script defer src="js/sousuo.js"></script>
<script defer src="js/fun.js"></script>
<script defer src="js/duration.js"></script>
<script defer src="js/wallpaper.js"></script>
<script defer src="js/ipinfo.js"></script>
<script defer src="js/visits.js"></script>
<script defer src="js/weather.js"></script>

<!-- 看板娘（第三方组件，异步加载，失败不影响主功能） -->
<script async src="https://cdn.jsdelivr.net/gh/stevenjoezhang/live2d-widget@latest/autoload.js"></script>

<!-- 已停用：
     js/yyss.js  —— 依赖仓库里不存在的 api.php（PHP 后端），静态站无法使用
     js/lianxiang.js —— 依赖已失效的百度联想接口，且每个按键都会发一次请求
     需要时可自行恢复并在 js/ 内配置可用接口
-->

<!-- 页脚 -->
<footer class="site-footer">
    <p class="site-footer-main">Simple Search · 简约舒爽的搜索体验</p>

    <!-- 访客 IPv4 与中文归属地，见 js/ipinfo.js -->
    <p class="site-footer-ip" id="ip-line" role="status" hidden>
        <span class="ip-dot" aria-hidden="true"></span>
        <span class="ip-pair"><span class="ip-label">IPv4</span><span id="ip-v4">--</span></span>
        <span class="ip-tag" id="ip-tag"></span>
        <span id="ip-loc"></span>
    </p>

    <!-- 游客访问量，见 js/visits.js -->
    <p class="site-footer-visits" id="visits-line" hidden>
        游客访问量 <span id="visit-count">--</span> 次
    </p>

    <p class="site-footer-meta">
        <span id="timeDate">载入天数...</span>
        <span id="times">载入时分秒...</span>
    </p>
</footer>

<!-- 音乐播放器 -->
<div id="music" key="67629c0cf3742" api="https://music.zbiwl.com"></div>
<script id="xplayer" src="https://music.zbiwl.com/Static/player9/js/player.js"></script>

</body>
</html>
